<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyph</title>
    <link rel="stylesheet" href="protected-content-info.css">
</head>
<body>
    <div class="dialog">
        <div class="header">
            <h1>
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                💡 Quick Tip
            </h1>
            <p>This page needs a simple extra step. Here's how to save content:</p>
        </div>

        <div class="content">
            <div class="steps">
                <div class="step">
                    <div class="step-number">1</div>
                    <div class="step-text">Select the text you want to save</div>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-text">Right-click on the selected text</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-text">Choose "Save to Zyph" from the context menu</div>
                </div>
            </div>

            <div class="note">
                <p><strong>Why?</strong> Your browser protects pages like settings and extensions for security.</p>
            </div>
        </div>

        <div class="footer">
            <button class="ok-btn" id="ok-btn">Got it</button>
        </div>
    </div>
    <script src="protected-content-info.js"></script>
</body>
</html>
